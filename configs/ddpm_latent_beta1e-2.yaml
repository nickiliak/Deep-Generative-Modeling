# DDPM in β-VAE Latent Space Configuration
# Mode: latent - trains DDPM on VAE latent representations
# β = 1e-2 = 0.01 (baseline - balanced KL penalty)

mode: latent

# Data settings
data:
  dataset: mnist
  batch_size: 256

# VAE settings (β-VAE with Gaussian decoder)
vae:
  beta: 1.0e-2
  latent_dim: 32
  decoder: gaussian
  decoder_std: 0.5
  checkpoint: null

# DDPM model settings
model:
  network: fc
  beta_1: 1.0e-4
  beta_T: 2.0e-2
  T: 1000

# Training settings
training:
  vae_epochs: 40
  ddpm_epochs: 60
  lr: 1.0e-3
  device: cuda

# Output paths
paths:
  model_dir: models
  vae_name: beta_vae_gaussian_beta{beta}_z{latent_dim}.pt
  model_name: ddpm_latent_T{T}_z{latent_dim}.pt
  fid_output_dir: reports/outputs/ddpm_latent
  samples_dir: reports/samples

# FID evaluation settings
fid:
  num_samples: 10000
  classifier_ckpt: models/mnist_classifier.pth

# Sampling settings
sampling:
  num_samples: 256
  grid_size: 8
